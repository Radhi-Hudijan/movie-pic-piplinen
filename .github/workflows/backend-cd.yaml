name : backend-cd

on:
    workflow_dispatch:
    push:
        branches: [ main ]
        paths:
        - 'starter/backend/**'
jobs:
  lint-job:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: starter/backend/.cache
          key: ${{ runner.os }}-python-${{ hashFiles('starter/backend/Pipfile') }}
      - name: install pipenv
        run: python -m pip install --upgrade pip pipenv
      - name: Install dependencies
        run: pipenv --python $(which python) install --dev
      - name: Run lint
        run: pipenv run lint
  test-job:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Debug Python
        run: |
          python --version
          which python
      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: starter/backend/.cache
          key: ${{ runner.os }}-python-${{ hashFiles('starter/backend/Pipfile') }}
      - name: install pipenv
        run: python -m pip install --upgrade pip pipenv
      - name: Install dependencies
        run: pipenv --python $(which python) install 
      - name: Run tests
        run: pipenv run test
 
  build-deploy:
    needs: [test-job, lint-job]   
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
        
        - name: Checkout code
          uses: actions/checkout@v3
        
        - name: set up AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: us-east-1

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Setup ECR Repository
          uses: deploy-actions/setup-ecr@v1
          with:
            RepositoryName: backend

        - name: set up Docker Buildx
          uses: docker/setup-buildx-action@v2

        - name: Build and push Docker image
          env: 
             REGISTRY: ${{ steps.login-ecr.outputs.registry }}
             REPOSITORY: backend
             IMAGE_TAG: ${{ github.sha }}
          run: |
           IMAGE_URI=${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
           docker build  --tag=${IMAGE_URI} .
           docker push ${IMAGE_URI}
           echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
           
        - name: configure kubeconfig for EKS cluster
          run: aws eks update-kubeconfig --region us-east-1 --name cluster

        - name: Deploy to EKS
          run: |
            cd k8s
            kustomize edit set image backend="$IMAGE_URI"
            kustomize build | kubectl apply -f -