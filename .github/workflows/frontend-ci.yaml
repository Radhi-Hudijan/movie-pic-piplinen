name: Frontend Continuous Integration
on:
    workflow_dispatch:
    pull_request:
        branches: [main]
        paths:
            - 'starter/frontend/**'
jobs:
    lint-job:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: starter/frontend
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3 

            # Perform a cache action to restore cache before dependency install
            - name: Restore dependency cache
              uses: actions/cache@v4
              with:
                path: starter/frontend/node_modules
                key: ${{ runner.os }}-node-${{ hashFiles('starter/frontend/package-lock.json') }}


            - name: Install dependencies
              run: npm install

            - name: Run lint
              run: npm run lint
    test-job:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: starter/frontend
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3

            - name: Restore dependency cache
              uses: actions/cache@v4
              with:
                path: starter/frontend/node_modules
                key: ${{ runner.os }}-node-${{ hashFiles('starter/frontend/package-lock.json') }}

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm run test

    build-job:
        runs-on: ubuntu-latest
        needs: [lint-job, test-job]
        defaults:
            run:
                working-directory: starter/frontend
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3

            - name: Restore dependency cache
              uses: actions/cache@v4
              with:
                path: starter/frontend/node_modules
                key: ${{ runner.os }}-node-${{ hashFiles('starter/frontend/package-lock.json') }}

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

    build-docker-job:
        runs-on: ubuntu-latest
        needs: build-job
        defaults:
            run:
                working-directory: starter/frontend
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Build Docker image
              run: docker build --tag mp-frontend:latest .

            - name: Run Docker container
              run: docker run -d -p 3000:3000 --name mp-frontend mp-frontend:latest

            - name: Verify application is running
              run: |
                sleep 10 # Wait for the container to start
                curl -f http://localhost:3000 || exit 1

            - name: Stop and remove Docker container
              run: |
                docker stop mp-frontend
                docker rm mp-frontend